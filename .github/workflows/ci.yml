name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm exec playwright install chromium
      - run: pnpm run test:ui
      - run: pnpm audit --prod --audit-level high
      - name: Build packages without publishing releases
        run: pnpm exec electron-builder --win portable nsis --publish never
